name: deploy-aks

# Manual only. Run it from the Actions tab after the Azure setup in docs/AKS-SETUP.md.
on:
  workflow_dispatch:

env:
  IMAGE_NAME: devsecops-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image on the runner and push to ACR
        run: |
          IMAGE=${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          az acr login --name ${{ secrets.ACR_NAME }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - name: Deploy to AKS
        run: |
          sed -i "s|devsecops-demo:latest|${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/devsecops-demo --timeout=180s

      - name: Show service address
        run: kubectl get svc devsecops-demo
