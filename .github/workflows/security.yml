name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly, Monday 03:00 UTC

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk dependency scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --json-file-output=snyk-results.json || true

      - name: Summarize and gate
        run: python scripts/summarize_snyk.py snyk-results.json --fail-on high

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-results
          path: snyk-results.json

  build-and-test:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devsecops-demo:ci .

      - name: Create a throwaway Kubernetes cluster (kind)
        uses: helm/kind-action@v1

      - name: Load image into the cluster
        run: kind load docker-image devsecops-demo:ci --name chart-testing

      - name: Deploy manifests
        run: |
          sed -i 's|devsecops-demo:latest|devsecops-demo:ci|' k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/devsecops-demo --timeout=120s

      - name: Smoke test /health
        run: |
          kubectl port-forward svc/devsecops-demo 8080:80 &
          sleep 5
          curl --fail --silent http://localhost:8080/health
